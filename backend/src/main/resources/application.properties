spring.application.name=ifAi

# JPA stores monitoring judgments in an embedded prototype database.
# Turku operational data remains read directly from backend/data/turku_data.sqlite.
spring.datasource.url=jdbc:h2:mem:ifai_judgments
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
